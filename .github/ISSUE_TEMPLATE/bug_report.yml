name: Bug report
description: Report a reproducible problem in FeatureBuilder
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include confidential specifications or credentials.
  - type: input
    id: version
    attributes:
      label: FeatureBuilder version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
